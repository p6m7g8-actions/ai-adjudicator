name: "P6 GHA: AI Adjudicator"
description: "Adjudicate machine-readable Claude PR review verdicts, resolve threads, approve, and enqueue"
author: "Philip M. Gollucci"

inputs:
  gh_token:
    description: "GitHub token with pull-request write permissions"
    required: true
  repo:
    description: "Owner/repo"
    required: false
    default: ${{ github.repository }}
  pr_number:
    description: "PR number to adjudicate; auto-detected if empty"
    required: false
    default: ""
  required_checks_csv:
    description: "Comma-delimited required check names"
    required: false
    default: "build,Lint PR title,claude-review"
  required_lanes_csv:
    description: >-
      Comma-delimited review lanes that must each report "patch is correct".
      A lane is the value carried by the "Review-Lane:" contract line, so the
      planned "security" and "conventions" lanes drop in here without a code
      change.
    required: false
    default: "code"
  allowed_bot_logins:
    description: >-
      Comma-delimited exact bot logins whose pull request CONVERSATION comments
      count as verdicts. Formal review bodies and inline review comments are not
      read at all, so an allowlisted identity that posts approving reviews rather
      than conversation comments can never supply a verdict. Defaults to the
      producer alone: github-actions[bot] is every workflow in the consuming
      repository, so allowlisting it lets any of them mint an accept by ending a
      comment with three short public lines. Add entries only for identities that
      genuinely post review verdicts.
    required: false
    default: "claude[bot]"
  iterate_comment:
    description: "Comment to post when verdict is iterate"
    required: false
    default: "Autonomous adjudicator: no accepting Claude verdict yet. Waiting for the next synchronize push."
  comment_on_iterate:
    description: "Post iterate comment when verdict=iterate"
    required: false
    default: "true"
  comment_on_unparseable:
    description: >-
      Post the fail-loud comment when an allowlisted author posted a verdict
      comment for a required lane but the contract lines could not be parsed.
      Independent of comment_on_iterate: this is the channel that keeps a
      broken producer from silently burning a bounded fix loop.
    required: false
    default: "true"
  approve_on_accept:
    description: "Submit approving review when verdict=accept and final guard passes"
    required: false
    default: "true"
  enqueue_on_accept:
    description: "Enable auto-merge enqueue on accept and final guard pass"
    required: false
    default: "true"

outputs:
  pr_number:
    description: "Adjudicated PR number"
    value: ${{ steps.select_pr.outputs.pr_number }}
  proceed:
    description: "Whether all required checks are green and PR can be adjudicated"
    value: ${{ steps.gate.outputs.proceed }}
  verdict:
    description: "accept|iterate|skip"
    value: ${{ steps.ai_out.outputs.verdict }}
  unparseable_lanes:
    description: "Comma-delimited lanes whose verdict comment could not be parsed"
    value: ${{ steps.ai_run.outputs.unparseable_lanes || '' }}
  findings_total:
    description: "Sum of Findings (total) across every lane that reported a parseable verdict"
    value: ${{ steps.ai_run.outputs.findings_total || '0' }}
  resolved_threads:
    description: "Count of resolved threads"
    value: ${{ steps.resolve.outputs.count || '0' }}
  review_decision:
    description: "GitHub reviewDecision at final guard"
    value: ${{ steps.final_guard.outputs.review_decision || '' }}
  final_guard_ok:
    description: "true when approval/enqueue is allowed"
    value: ${{ steps.final_guard.outputs.ok || 'false' }}

runs:
  using: "composite"
  steps:
    # Single definition of the marker this action stamps on every comment it
    # posts. The parser skips any comment carrying it, so the adjudicator can
    # never read its own output back as a verdict, and re-running it on an
    # already-adjudicated PR stays idempotent.
    - name: Constants
      id: consts
      shell: bash
      run: |
        set -euo pipefail
        echo 'self_marker=<!-- p6-adjudicator -->' >> "$GITHUB_OUTPUT"

    - name: Select PR
      id: select_pr
      shell: bash
      env:
        IN_PR_NUMBER: ${{ inputs.pr_number }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      run: |
        set -euo pipefail
        pr_number="$IN_PR_NUMBER"
        if [ -z "$pr_number" ]; then
          pr_number="$EVENT_PR_NUMBER"
        fi
        if [ -z "$pr_number" ]; then
          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
        fi
        echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

    - name: Gate on PR state and required checks
      id: gate
      if: steps.select_pr.outputs.pr_number != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        REPO: ${{ inputs.repo }}
        PR_NUMBER: ${{ steps.select_pr.outputs.pr_number }}
        REQUIRED_CHECKS_CSV: ${{ inputs.required_checks_csv }}
      run: |
        set -euo pipefail

        state=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state --jq '.state')
        draft=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json isDraft --jq '.isDraft')
        head_sha=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')

        if [ "$state" != "OPEN" ] || [ "$draft" = "true" ]; then
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Paginated: a p6-build fleet puts well over 100 check runs on a SHA,
        # and a truncated page makes a required check read as absent, which is
        # a permanent proceed=false with nothing in the log to explain it.
        checks_json=$(gh api --paginate -H "Accept: application/vnd.github+json" \
          "/repos/$REPO/commits/$head_sha/check-runs?per_page=100" \
          | jq -s '{ check_runs: (map(.check_runs) | add // []) }')

        IFS=',' read -r -a required <<< "$REQUIRED_CHECKS_CSV"
        checks_seen=0

        for name in "${required[@]}"; do
          name="$(echo "$name" | sed 's/^ *//; s/ *$//')"
          [ -z "$name" ] && continue
          checks_seen=$((checks_seen + 1))
          count=$(echo "$checks_json" | jq --arg n "$name" '[.check_runs[] | select(.name == $n)] | length')
          if [ "$count" -eq 0 ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(echo "$checks_json" | jq -r --arg n "$name" '[.check_runs[] | select(.name == $n)] | sort_by(.started_at) | last | .status')
          conclusion=$(echo "$checks_json" | jq -r --arg n "$name" '[.check_runs[] | select(.name == $n)] | sort_by(.started_at) | last | .conclusion')
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done

        # An empty required_checks_csv would run the loop zero times and reach
        # proceed=true having verified nothing. Same fail-open shape as the
        # zero-lanes guard; refuse it the same way.
        if [ "$checks_seen" -eq 0 ]; then
          echo "::error title=Adjudicator misconfigured::required_checks_csv resolved to zero checks"
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Freshness cutoff for verdict comments. See the Freshness section of
        # README.md for why this exists and what it defends against.
        #
        # The cutoff is the earliest check SUITE creation time on the head SHA.
        # Suites are created in response to the push, so this lands just after
        # it, and `created_at` is server-assigned, immutable, and not settable
        # by the PR author the way a commit's committer date is.
        #
        # It must not move under re-runs. Check RUN started_at does move: a
        # re-run updates the run in place, so "Re-run all jobs" after a flake
        # would push the cutoff past a genuine fresh verdict and deadlock the PR
        # at quiet iterate while it was otherwise green. Suite created_at does
        # not move; a re-run either updates the existing suite's updated_at or
        # adds a later suite, and taking the minimum ignores both.
        #
        # A commit's GraphQL pushedDate would be the natural answer and is what
        # the review suggested, but that field is deprecated -- "no longer
        # supported. Removal on 2023-07-01 UTC" -- and returns null for every
        # commit, verified against this repository and against public ones.
        suites_json=$(gh api --paginate -H "Accept: application/vnd.github+json" \
          "/repos/$REPO/commits/$head_sha/check-suites?per_page=100" \
          | jq -s '{ check_suites: (map(.check_suites) | add // []) }')
        verdict_after=$(echo "$suites_json" | jq -r '[.check_suites[].created_at // empty] | sort | first // ""')

        # Refuse rather than continue without a cutoff. Treating an empty value
        # as "no filter" would let an unexpected API shape silently switch off
        # the freshness guard, which is the fail-open this action keeps closing.
        if [ -z "$verdict_after" ]; then
          echo "::error title=Adjudicator cannot establish freshness::no check suite creation time on $head_sha"
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        {
          echo "head_sha=$head_sha"
          echo "verdict_after=$verdict_after"
          echo "proceed=true"
        } >> "$GITHUB_OUTPUT"

    - name: AI adjudication (nothing to adjudicate)
      id: ai
      if: steps.select_pr.outputs.pr_number == '' || steps.gate.outputs.proceed != 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo "verdict=skip" >> "$GITHUB_OUTPUT"

    - name: AI adjudication (parse lane verdicts)
      id: ai_run
      if: steps.gate.outputs.proceed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        REPO: ${{ inputs.repo }}
        PR_NUMBER: ${{ steps.select_pr.outputs.pr_number }}
        REQUIRED_LANES_CSV: ${{ inputs.required_lanes_csv }}
        ALLOWED_BOT_LOGINS: ${{ inputs.allowed_bot_logins }}
        VERDICT_AFTER: ${{ steps.gate.outputs.verdict_after }}
        SELF_MARKER: ${{ steps.consts.outputs.self_marker }}
      run: |
        set -euo pipefail

        # Verdict contract, produced by p6m7g8-actions/claude. The LAST THREE
        # NON-EMPTY LINES of the comment, in this order and nothing after them:
        #
        #   Review-Lane: code
        #   Overall: patch is correct
        #   Findings (total): 0
        #
        # They are at the end, not the start, because claude-code-action with
        # track_progress writes its own "Claude finished ... in Xm Ys" header
        # first, so the start of the comment is not the producer's to control.
        # Nothing anchors on the first line and no leading prefix is required.
        # "Overall: patch is incorrect" is the negative form. There is one voice
        # now that Codex is retired, so there is nothing to reconcile: every
        # required lane must say correct.
        #
        # ACCEPTANCE is positional on those last three lines and is never a scan
        # of the whole body. Scanning to accept was a fail-open: a review that
        # merely QUOTES the contract while discussing it emitted a parseable
        # verdict, and this action's own fail-loud comment used to reproduce the
        # contract, so run N would report a broken producer and run N+1 would
        # read its own comment back as a pass and auto-merge. Three independent
        # guards close that: positional acceptance, the self-marker below, and a
        # loud comment that describes the lines instead of reproducing them.
        #
        # The body IS scanned for one purpose that cannot fail open, because it
        # only ever turns a rejection into a louder rejection: if no candidate
        # carries the lane in its last three lines but some candidate names it
        # anywhere in its body, the lane is unparseable rather than missing, so
        # it takes the loud path. That is the likeliest real failure, since
        # claude-code-action's own prompt appends a branch link at the bottom of
        # the comment, which pushes a perfectly good contract out of the tail.
        #
        # Comments are read over REST, not `gh pr view --json comments`. The
        # GraphQL shape gh uses renders a GitHub App author with the "[bot]"
        # suffix stripped, so the Claude app arrives as "claude" -- and
        # github.com/claude is a real, separate human account. REST reports the
        # "claude[bot]" form, which no user account can hold because "[" is not
        # a legal login character, so exact-match allowlisting is only sound
        # over REST.
        #
        # Only pull request conversation comments are read. Formal review bodies
        # (/pulls/{n}/reviews) and inline review comments are deliberately out
        # of scope: the producer posts to the conversation, and an allowlisted
        # identity's approving review is an approval, not a verdict.
        comments_json="$(gh api --paginate -H "Accept: application/vnd.github+json" \
          "/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" | jq -s 'add // []')"

        # Emits one TSV record per required lane:
        #   <lane>\t<correct|incorrect|missing|unparseable>\t<findings>\t<detail>
        # Lane and contract lines are compared as trimmed literals rather than
        # by interpolating the lane into a regex, so a lane name can never be
        # read as a metacharacter.
        verdict_program='
        def trim: gsub("^\\s+|\\s+$"; "");
        def clean: gsub("`"; "");
        def tail3: split("\n") | map(gsub("\r"; "") | trim) | map(select(length > 0)) | (["", "", ""] + .) | .[-3:];
        def all_lines: split("\n") | map(gsub("\r"; "") | trim) | map(select(length > 0));
        def lanes_named: [ .[] | select(startswith("Review-Lane:")) | ltrimstr("Review-Lane:") | trim ];
        ($allowed | split(",") | map(trim) | map(select(length > 0))) as $logins
        | ($lanes | split(",") | map(trim) | map(select(length > 0))) as $required
        | [ .[]
            | select(((.user.login // "") | . as $login | $logins | index($login)))
            | select(((.body // "") | contains($marker)) | not)
            | { author: (.user.login // ""),
                at: (.updated_at // .created_at // ""),
                tail: ((.body // "") | tail3),
                body_lanes: ((.body // "") | all_lines | lanes_named) }
            | select(.at >= $after)
          ] | sort_by(.at) as $candidates
        | $required[] as $lane
        | [ $candidates[] | select(.tail | lanes_named | index($lane)) ] as $attempts
        | if ($attempts | length) == 0
          then
            # Nothing carries the lane in its tail. If some candidate names the
            # lane anywhere in its body, the producer emitted a contract that is
            # not where it must be, so say so loudly instead of going quiet.
            if [ $candidates[] | select(.body_lanes | index($lane)) ] | length > 0
            then [$lane, "unparseable", "",
                  "contract lines found in the body but not as the last three lines; nothing may follow them, including a trailing branch or job link"]
            else [$lane, "missing", "", ""]
            end
          else
            ($attempts | last) as $chosen
            | [ $candidates[]
                | select(.at > $chosen.at and .author == $chosen.author)
                | select((.tail | map(select(startswith("Review-Lane:"))) | length) == 0)
              ] as $superseding
            | if ($superseding | length) > 0
              then [$lane, "missing", "", ""]
              else
                $chosen.tail as $t
                | ($t[0] | ltrimstr("Review-Lane:") | trim) as $tlane
                | ($t[1] | ltrimstr("Overall:") | trim) as $overall
                | ($t[2] | ltrimstr("Findings (total):") | trim) as $findings
                | (($t[0] | startswith("Review-Lane:")) and $tlane == $lane) as $p0
                | ($t[1] | startswith("Overall:")) as $p1
                | ($t[2] | startswith("Findings (total):")) as $p2
                | if $p0 and $p1 and $p2
                     and ($overall | test("^patch is (correct|incorrect)$"))
                     and ($findings | test("^[0-9]+$"))
                  then [$lane, (if $overall == "patch is correct" then "correct" else "incorrect" end), $findings, ""]
                  elif ($t | map(select(startswith("Overall:"))) | length) == 0
                  then [$lane, "unparseable", "", "no `Overall:` line in the last three lines"]
                  elif ($t | map(select(startswith("Findings (total):"))) | length) == 0
                  then [$lane, "unparseable", "", "no `Findings (total):` line in the last three lines"]
                  elif (($p0 and $p1 and $p2) | not)
                  then [$lane, "unparseable", "", "contract lines are present but are not the last three lines, in order"]
                  elif ($overall | test("^patch is (correct|incorrect)$") | not)
                  then [$lane, "unparseable", "", "malformed `Overall:` value: " + ($overall | clean | @json)]
                  else [$lane, "unparseable", "", "malformed `Findings (total):` value: " + ($findings | clean | @json)]
                  end
              end
          end
        | @tsv'

        # The gate refuses to proceed without a cutoff, so this is belt to that
        # brace. Left unchecked, an empty cutoff makes every `.at >= $after`
        # string comparison true and silently disables the freshness filter.
        if [ -z "$VERDICT_AFTER" ]; then
          echo "::error title=Adjudicator refusing to parse::no freshness cutoff was established"
          echo "verdict=iterate" >> "$GITHUB_OUTPUT"
          echo "unparseable_lanes=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        records="$(jq -r \
          --arg allowed "$ALLOWED_BOT_LOGINS" \
          --arg lanes "$REQUIRED_LANES_CSV" \
          --arg after "$VERDICT_AFTER" \
          --arg marker "$SELF_MARKER" \
          "$verdict_program" <<< "$comments_json")"

        accept="true"
        lanes_seen=0
        unparseable_lanes=""
        report=""
        findings_total=0

        # Fields are split by hand rather than with `IFS=$'\t' read`. Tab is an
        # IFS whitespace character even when IFS is set to it alone, so `read`
        # collapses a run of tabs into one delimiter and an empty middle field
        # silently shifts every field after it left by one.
        while IFS= read -r record; do
          [ -z "$record" ] && continue
          lane="${record%%$'\t'*}"
          rest="${record#*$'\t'}"
          state="${rest%%$'\t'*}"
          rest="${rest#*$'\t'}"
          findings="${rest%%$'\t'*}"
          detail="${rest#*$'\t'}"
          lanes_seen=$((lanes_seen + 1))
          case "$state" in
            correct)
              findings_total=$((findings_total + findings))
              echo "adjudicator: lane '$lane' reports patch is correct, $findings finding(s)."
              ;;
            incorrect)
              accept="false"
              findings_total=$((findings_total + findings))
              echo "adjudicator: lane '$lane' reports patch is incorrect, $findings finding(s)."
              ;;
            missing)
              accept="false"
              echo "adjudicator: lane '$lane' has no verdict comment from an allowlisted author yet."
              ;;
            *)
              # Fail loud. A bare iterate here would burn every iteration of a
              # bounded fix loop before anyone looked at the run.
              accept="false"
              unparseable_lanes="${unparseable_lanes:+$unparseable_lanes,}$lane"
              # Double quotes, not a backticked span: the detail can carry text
              # lifted out of a comment, and an unbalanced backtick would
              # otherwise swallow the rest of the line as a code span.
              report="${report}- lane \"$lane\": $detail"$'\n'
              echo "::error title=Unparseable AI verdict::lane '$lane': $detail"
              ;;
          esac
        done <<< "$records"

        if [ "$lanes_seen" -eq 0 ]; then
          # No lanes means nothing was ever checked; never accept on that.
          accept="false"
          echo "::error title=Adjudicator misconfigured::required_lanes_csv resolved to zero lanes"
        fi

        verdict="iterate"
        if [ "$accept" = "true" ]; then
          verdict="accept"
        fi

        {
          echo "verdict=$verdict"
          echo "unparseable_lanes=$unparseable_lanes"
          echo "findings_total=$findings_total"
        } >> "$GITHUB_OUTPUT"

        if [ -n "$unparseable_lanes" ]; then
          {
            echo "unparseable_report<<P6_ADJUDICATOR_REPORT_EOF"
            printf '%s' "$report"
            echo "P6_ADJUDICATOR_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Export verdict
      id: ai_out
      shell: bash
      env:
        V1: ${{ steps.ai.outputs.verdict }}
        V2: ${{ steps.ai_run.outputs.verdict }}
      run: |
        set -euo pipefail
        verdict="$V1"
        if [ -n "$V2" ]; then
          verdict="$V2"
        fi
        [ -z "$verdict" ] && verdict="skip"
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

    - name: Unparseable verdict comment
      if: steps.ai_run.outputs.unparseable_lanes != '' && inputs.comment_on_unparseable == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        REPO: ${{ inputs.repo }}
        PR_NUMBER: ${{ steps.select_pr.outputs.pr_number }}
        UNPARSEABLE_LANES: ${{ steps.ai_run.outputs.unparseable_lanes }}
        UNPARSEABLE_REPORT: ${{ steps.ai_run.outputs.unparseable_report }}
        SELF_MARKER: ${{ steps.consts.outputs.self_marker }}
        HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
      run: |
        set -euo pipefail

        # Dedup. This action fires on pull_request_target including `edited`,
        # and on workflow_run completion of both Build and Claude Code Review,
        # so one push with a broken producer used to draw several identical
        # comments and every body edit added another. The key is scoped to the
        # head SHA so a new push does report again.
        dedup_key="<!-- p6-adjudicator-key: unparseable:$HEAD_SHA:$UNPARSEABLE_LANES -->"
        existing="$(gh api --paginate -H "Accept: application/vnd.github+json" \
          "/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
          | jq -s --arg k "$dedup_key" '[ (map(.) | add // [])[] | select((.body // "") | contains($k)) ] | length')"
        if [ "$existing" -gt 0 ]; then
          echo "adjudicator: unparseable verdict already reported for this head; not reposting."
          exit 0
        fi

        # This comment DESCRIBES the contract lines; it must never reproduce
        # them. An earlier version printed them indented four spaces to render
        # as a code block, but the parser trimmed each line before matching, so
        # this comment was itself a well-formed PASSING verdict, authored by an
        # allowlisted identity and newer than the real review. Reporting a
        # broken producer therefore turned into an auto-merge on the next run.
        # No line below may begin with a contract keyword, and the self-marker
        # is the last line so the parser skips the comment outright.
        body_file="${RUNNER_TEMP:-/tmp}/p6-adjudicator-unparseable.md"
        {
          printf 'Autonomous adjudicator: unparseable verdict for lane(s) "%s".\n\n' "$UNPARSEABLE_LANES"
          printf '%s\n\n' "$UNPARSEABLE_REPORT"
          printf 'A conversation comment from an allowlisted author was found for the lane, but it did not'
          printf ' end with the machine-readable verdict block. The last three non-empty lines of the review'
          printf ' must be, in this order and with nothing after them: a lane line naming the review lane,'
          printf ' an overall line reading either that the patch is correct or that it is incorrect, and a'
          printf ' findings-total line carrying an integer. The exact spelling is defined by the producer,'
          printf ' p6m7g8-actions/claude. Emit them as plain text: no bold, no list marker, no code fence,'
          printf ' no table, and no trailing footer.\n\n'
          printf 'Verdict is "iterate". This is reported rather than passed over in silence because a silent'
          printf ' iterate consumes the whole fix loop.\n'
          printf '\n%s\n%s\n' "$SELF_MARKER" "$dedup_key"
        } > "$body_file"
        gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$body_file"

    - name: Iterate comment
      if: steps.ai_out.outputs.verdict == 'iterate' && inputs.comment_on_iterate == 'true' && steps.ai_run.outputs.unparseable_lanes == ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        REPO: ${{ inputs.repo }}
        PR_NUMBER: ${{ steps.select_pr.outputs.pr_number }}
        ITERATE_COMMENT: ${{ inputs.iterate_comment }}
        SELF_MARKER: ${{ steps.consts.outputs.self_marker }}
        HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
      run: |
        set -euo pipefail

        # Same dedup as the fail-loud comment, and the same reason: several
        # triggers per push each used to draw another identical comment.
        dedup_key="<!-- p6-adjudicator-key: iterate:$HEAD_SHA -->"
        existing="$(gh api --paginate -H "Accept: application/vnd.github+json" \
          "/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
          | jq -s --arg k "$dedup_key" '[ (map(.) | add // [])[] | select((.body // "") | contains($k)) ] | length')"
        if [ "$existing" -gt 0 ]; then
          echo "adjudicator: iterate already reported for this head; not reposting."
          exit 0
        fi

        # iterate_comment is caller-supplied, so the marker is appended here
        # rather than trusted to be present in the input.
        gh pr comment "$PR_NUMBER" --repo "$REPO" \
          --body "$(printf '%s\n\n%s\n%s\n' "$ITERATE_COMMENT" "$SELF_MARKER" "$dedup_key")"

    - name: Resolve all unresolved review threads
      id: resolve
      if: steps.ai_out.outputs.verdict == 'accept'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        REPO: ${{ inputs.repo }}
        PR_NUMBER: ${{ steps.select_pr.outputs.pr_number }}
        SELF_MARKER: ${{ steps.consts.outputs.self_marker }}
      run: |
        set -euo pipefail
        owner="${REPO%%/*}"
        repo="${REPO##*/}"

        query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{id isResolved}}}}}'
        threads=$(gh api graphql -f query="$query" -F owner="$owner" -F repo="$repo" -F number="$PR_NUMBER" --jq '.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false) | .id' || true)

        count=0
        while IFS= read -r tid; do
          [ -z "$tid" ] && continue
          mutation='mutation($threadId:ID!){resolveReviewThread(input:{threadId:$threadId}){thread{id isResolved}}}'
          gh api graphql -f query="$mutation" -F threadId="$tid" >/dev/null
          count=$((count + 1))
        done <<< "$threads"

        echo "count=$count" >> "$GITHUB_OUTPUT"
        gh pr comment "$PR_NUMBER" --repo "$REPO" \
          --body "$(printf 'Autonomous adjudicator: resolved %s unresolved review thread(s).\n\n%s\n' "$count" "$SELF_MARKER")"

    - name: Final guard
      id: final_guard
      if: steps.ai_out.outputs.verdict == 'accept'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        REPO: ${{ inputs.repo }}
        PR_NUMBER: ${{ steps.select_pr.outputs.pr_number }}
      run: |
        set -euo pipefail
        decision=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json reviewDecision --jq '.reviewDecision')
        echo "review_decision=$decision" >> "$GITHUB_OUTPUT"
        if [ "$decision" = "CHANGES_REQUESTED" ]; then
          echo "ok=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "ok=true" >> "$GITHUB_OUTPUT"

    - name: Approve PR
      if: steps.ai_out.outputs.verdict == 'accept' && steps.final_guard.outputs.ok == 'true' && inputs.approve_on_accept == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        REPO: ${{ inputs.repo }}
        PR_NUMBER: ${{ steps.select_pr.outputs.pr_number }}
        REQUIRED_LANES_CSV: ${{ inputs.required_lanes_csv }}
        FINDINGS_TOTAL: ${{ steps.ai_run.outputs.findings_total }}
        SELF_MARKER: ${{ steps.consts.outputs.self_marker }}
      run: |
        set -euo pipefail
        # Describes the outcome; it must not quote the contract. This body used
        # to reproduce the positive Overall line verbatim, which is the one
        # string this action goes out of its way never to write. It is inert
        # while /pulls/{n}/reviews is unread, but widening the parse scope later
        # would have turned an approval into a verdict. The self-marker is here
        # for the same reason: so that if reviews ever are read, this is skipped
        # like every other body the action posts.
        gh pr review "$PR_NUMBER" --repo "$REPO" --approve \
          --body "$(printf 'Autonomous approval: every required review lane (%s) returned a passing verdict, with %s finding(s) reported in total.\n\n%s\n' \
            "$REQUIRED_LANES_CSV" "${FINDINGS_TOTAL:-0}" "$SELF_MARKER")"

    - name: Enqueue PR
      if: steps.ai_out.outputs.verdict == 'accept' && steps.final_guard.outputs.ok == 'true' && inputs.enqueue_on_accept == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        REPO: ${{ inputs.repo }}
        PR_NUMBER: ${{ steps.select_pr.outputs.pr_number }}
      run: |
        set -euo pipefail
        gh pr merge --auto --squash -R "$REPO" "$PR_NUMBER"
